kind = "api"
previewPath = "/api"
title = "TMCIS Django API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "uv run --project . python backend/manage.py runserver 0.0.0.0:8080"

[services.production]

[services.production.build]
args = ["uv", "sync", "--project", ".", "--frozen", "--no-dev"]

[services.production.run]
args = ["uv", "run", "--project", ".", "gunicorn", "--chdir", "backend", "tmcis_backend.wsgi:application", "--bind", "0.0.0.0:8080", "--workers", "2"]

[services.production.run.env]
PORT = "8080"
DJANGO_DEBUG = "false"

[services.production.health.startup]
path = "/api/api/v1/healthz"
